apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cinema-api
  namespace: le-grand-cinema-preprod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cinema-api
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
