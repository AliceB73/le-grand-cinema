services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      VITE_API_BASE_URL: http://localhost:3000
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env from the Supabase cloud project}
      DIRECT_URL: ${DIRECT_URL:?Set DIRECT_URL in .env from the Supabase cloud project}
      SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL in .env from the Supabase cloud project}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?Set SUPABASE_ANON_KEY in .env from the Supabase cloud project}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?Set SUPABASE_SERVICE_ROLE_KEY in .env from the Supabase cloud project}
    ports:
      - '3000:3000'
    volumes:
      - .:/workspace
      - api_node_modules:/workspace/node_modules

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      - api
    env_file:
      - path: .env
        required: false
    environment:
      VITE_API_BASE_URL: http://localhost:3000
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?Set VITE_SUPABASE_URL in .env from the Supabase cloud project}
      VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:?Set VITE_SUPABASE_ANON_KEY in .env from the Supabase cloud project}
    ports:
      - '5173:5173'
    volumes:
      - .:/workspace
      - web_node_modules:/workspace/node_modules

volumes:
  api_node_modules:
  web_node_modules:
